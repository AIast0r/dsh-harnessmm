name: Security hardening regression tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: |
          node --check index.mjs
          node --check jobs.mjs
          node --check controller.mjs
          node --check security_utils.mjs
      - name: Check Python syntax
        run: python -m py_compile python/dsh_harnessmm_rsi/runner.py
      - name: Test local security safeguards
        run: node --test tests/security-hardening.test.mjs
      - run: python -m pip install pytest
      - name: Test Windows path validation
        run: python -m pytest python/tests/test_security_hardening.py
        env:
          PYTHONPATH: python
